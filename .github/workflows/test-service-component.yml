name: Test OCM v2 Service Component Direct Publish

on:
  workflow_dispatch:
    inputs:
      chartVersion:
        description: "Chart version"
        required: true
        default: "0.1.0"
      appVersion:
        description: "App version"
        required: true
        default: "v0.1.0"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup OCM CLI
        run: |
          REPO="open-component-model/open-component-model"
          version="v0.13.0"
          echo "Installing ocm-cli version $version from $REPO"
          curl -LsS -o ocm "https://github.com/$REPO/releases/download/${version}/ocm-linux-amd64"
          chmod a+x ocm

      - name: Write OCM credentials file
        run: |
          cat <<EOF > $HOME/.ocmconfig
          type: generic.config.ocm.software/v1
          configurations:
            - type: credentials.config.ocm.software
              consumers:
                - identity:
                    type: OCIRegistry
                    scheme: https
                    hostname: ghcr.io
                    path: akafazov
                  credentials:
                    - type: Credentials
                      properties:
                        username: ${{ github.actor }}
                        password: ${{ secrets.GHCR_TOKEN }}
          EOF

      - name: Create test component constructors
        run: |
          # Create the chart component (dependency)
          cat <<'EOF' > chart-constructor.yaml
          components:
            - name: "github.com/akafazov/test-ocm-v2-service-component/chart"
              version: "${VERSION}"
              provider:
                name: Test Team
          EOF

          # Create the service component that references the chart
          cat <<'EOF' > component-constructor.yaml
          components:
            - name: "github.com/akafazov/test-ocm-v2-service-component/service"
              version: "${VERSION}"
              provider:
                name: Test Team
              componentReferences:
                - name: chart
                  componentName: "github.com/akafazov/test-ocm-v2-service-component/chart"
                  version: "${VERSION}"
          EOF

      - name: Test Add component-versions to remote registry (OCM v2)
        run: |
          echo "Testing OCM v2 component-versions publishing directly to ghcr.io/akafazov..."
          echo "Publishing to: ghcr.io/akafazov"
          echo ""
          echo "Step 1: Create the chart component dependency"
          ./ocm add component-versions --repository "ghcr.io/akafazov" --constructor chart-constructor.yaml
          echo ""
          echo "Step 2: Create the service component that references the chart"
          ./ocm add component-versions --repository "ghcr.io/akafazov" --constructor component-constructor.yaml
          echo ""
          echo "✓ Success! Service component was published with external chart reference resolved"
        env:
          VERSION: ${{ inputs.chartVersion }}

      - name: Verify components were published to registry
        run: |
          echo "Verifying chart component in ghcr.io/akafazov..."
          ./ocm get component-version "ghcr.io/akafazov//github.com/akafazov/test-ocm-v2-service-component/chart:${{ inputs.chartVersion }}" -o yaml
          echo ""
          echo "Verifying service component in ghcr.io/akafazov..."
          ./ocm get component-version "ghcr.io/akafazov//github.com/akafazov/test-ocm-v2-service-component/service:${{ inputs.chartVersion }}" -o yaml
